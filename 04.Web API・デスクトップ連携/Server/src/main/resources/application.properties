# 受け取りの上限（SampleRestController.MAX_PRINT_DATA_BYTES = 64 MiB。4 つのサーバーで同じ。2026-10-13 決定）を超えた本文は、読むのを途中で止めて 413 を返す（T-H1・BUG-28）。
# Tomcat は残りの本文を読み捨ててから応答を返す。既定（2 MB）では、上限をわずかに超えた要求でも 413 を返す前に接続を切り、
# 送り手には 413 が届かない。読み捨てはメモリーを使わないので、上限と同じ 64 MiB まで読み捨てる（それを超えれば接続を切る）。
server.tomcat.max-swallow-size=64MB
# 本文が 30 秒以内に届かなければ 408（4 つのサーバーで同じ）。環境変数 SERVER_TOMCAT_CONNECTION_TIMEOUT で変えられる。
server.tomcat.connection-timeout=30s
